<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-NJOY Interface Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Clearly identifies this as a prototype/demo -->
    <div class="demo-banner">
        ⚠️ INTERFACE DEMO — THIS IS A SOFTWARE MOCKUP OF THE PLANNED E-NJOY DEVICE
    </div>

    <div class="device">

        <header>
            <div>
                <h1>E-NJOY</h1>
                <p>Your digital world. Anywhere.</p>
            </div>

            <div class="clock" id="clock">00:00</div>
        </header>

        <!-- HOME SCREEN -->
        <main id="home">

            <button class="app-button" onclick="openScreen('Books')">
                <span class="icon">📚</span>
                <b>BOOKS</b>
                <small>Read e-books & PDFs</small>
            </button>

            <button class="app-button" onclick="openScreen('Videos')">
                <span class="icon">🎬</span>
                <b>VIDEOS</b>
                <small>Watch your videos</small>
            </button>

            <button class="app-button" onclick="openScreen('Music')">
                <span class="icon">🎵</span>
                <b>MUSIC</b>
                <small>Play your music</small>
            </button>

            <button class="app-button" onclick="openScreen('Gallery')">
                <span class="icon">🖼️</span>
                <b>GALLERY</b>
                <small>View your images</small>
            </button>

            <button class="app-button" onclick="openScreen('Files')">
                <span class="icon">📁</span>
                <b>FILES</b>
                <small>Browse your files</small>
            </button>

            <button class="app-button" onclick="openScreen('Settings')">
                <span class="icon">⚙️</span>
                <b>SETTINGS</b>
                <small>Configure E-NJOY</small>
            </button>

        </main>

        <!-- APP SCREEN -->
        <section id="screen" class="screen hidden">

            <button class="back-button" onclick="goHome()">
                ← HOME
            </button>

            <h2 id="screenTitle">App</h2>

            <div id="screenContent" class="placeholder">
                <h3>Coming soon</h3>
                <p>This part of the E-NJOY interface is currently being developed.</p>
            </div>

        </section>

        <footer>
            E-NJOY V1 • Student Built • Interface Prototype
        </footer>

    </div>

    <script src="./script.js"></script>

</body>
</html>
