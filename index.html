<!DOCTYPE html>
<html>
<head>
    <title>E-NJOY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="warning">
        ⚠ INTERFACE PROTOTYPE — This is just a Demo
    </div>

    <div class="main">

        <div class="top">
            <div>
                <h1>E-NJOY</h1>
                <div class="subtitle">Your digital world. Anywhere.</div>
            </div>

            <div class="time" id="clock">
                00:00
            </div>
        </div>


        <div class="buttons">

            <div class="button" onclick="openSection('Books')">
                <span class="icon">📚</span>
                <h2>BOOKS</h2>
            </div>

            <div class="button" onclick="openSection('Videos')">
                <span class="icon">🎬</span>
                <h2>VIDEOS</h2>
            </div>

            <div class="button" onclick="openSection('Music')">
                <span class="icon">🎵</span>
                <h2>MUSIC</h2>
            </div>

            <div class="button" onclick="openSection('Gallery')">
                <span class="icon">🖼️</span>
                <h2>GALLERY</h2>
            </div>

            <div class="button" onclick="openSection('Files')">
                <span class="icon">📁</span>
                <h2>FILES</h2>
            </div>

            <div class="button" onclick="openSection('Settings')">
                <span class="icon">⚙️</span>
                <h2>SETTINGS</h2>
            </div>

        </div>


        <div class="content-box">

            <div class="content-header">
                <h2 id="sectionTitle">Home</h2>

                <input
                    type="text"
                    id="search"
                    placeholder="Search..."
                    oninput="searchFiles()"
                >
            </div>

            <div id="fileList">
                <div class="empty">
                    No files added yet.
                </div>
            </div>

        </div>


        <div class="add">

            <div class="add-title">
                Add content
            </div>

            <div class="add-text">
                Select files from your computer and add them to E-NJOY.
            </div>

            <button
                class="choose"
                onclick="document.getElementById('fileInput').click()"
            >
                Choose files
            </button>

            <input
                type="file"
                id="fileInput"
                multiple
                onchange="filesAdded()"
            >

        </div>


        <div class="panel" id="settingsPanel">

            <h2>Settings</h2>

            <p>Theme</p>

            <button class="settingButton" onclick="changeTheme()">
                Change Theme
            </button>

            <button class="settingButton" onclick="clearFiles()">
                Clear Files
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
